<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Angular Project</title>
    <script src="node_modules/angular/angular.js"></script>
    <script src="app.js"></script>
</head>
<body ng-controller="MyController">
    <h1>Student Details</h1>
    <h2>Hello {{ student.name }}</h2>
    <h2> your age is {{ student.age}}</h2>
    <h3> update the student name and age</h3>
    <input type="text" ng-model="name">
    <p> updated name:{{ student.name }}</p>
    <input type="text" ng-model="age">
    <p>updated age:{{student.age}} </p>
    <ul>
        <li><strong>age:</strong> {{ student.age }}</li>
        <li><strong>Department:</strong> {{ student.department }}</li>
        <li><strong>Semester:</strong> {{ student.semester }}</li>
    </ul>
</body>
</html>
