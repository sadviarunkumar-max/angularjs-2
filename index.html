<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Angular Project</title>
    <!-- Core Angular Framework -->
    <script src="node_modules/angular/angular.js"></script>
    <!-- Custom Application Logic -->
    <script src="app.js"></script>
</head>
<body ng-controller="MyController">

    <h1>Student Details</h1>
    <h2>Hello {{ student.name }}</h2>

    <!-- Visual layout to display complete student data -->
    <ul>
        <li><strong>Roll Number:</strong> {{ student.rollNumber }}</li>
        <li><strong>Course:</strong> {{ student.course }}</li>
        <li><strong>Status:</strong> {{ student.status }}</li>
    </ul>

</body>
</html>
